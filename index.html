<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guía de Educación Superior y Becas en Costa Rica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Encabezado Principal con Colores Fijos -->
    <header class="main-header">
        <div class="header-content">
            <div class="brand-title">
                <h1>Guía de Educación Superior y Becas en Costa Rica</h1>
                <p class="subtitle">Opciones de ingreso, carreras y beneficios socioeconómicos para la población estudiantil migrante.</p>
            </div>
            <button id="btn-theme-toggle" class="theme-toggle-btn" type="button" aria-label="Cambiar tema">
                <span id="theme-icon">🌙</span> <span id="theme-text">Modo Oscuro</span>
            </button>
        </div>
    </header>

    <main class="container">
        <!-- Buscador general -->
        <section class="search-section">
            <input type="text" id="input-busqueda" placeholder="🔍 Buscar por universidad, carrera o requisito..." aria-label="Buscador general">
        </section>

        <!-- Carrusel / Galería de Instituciones -->
        <section class="carousel-section">
            <div class="carousel-controls">
                <h2>Instituciones Destacadas</h2>
                <div class="nav-btns">
                    <button id="btn-prev" class="btn-nav" aria-label="Anterior">◄</button>
                    <button id="btn-next" class="btn-nav" aria-label="Siguiente">►</button>
                </div>
            </div>
            <div id="carousel-track" class="carousel-track">
                <!-- Se renderiza dinámicamente desde script.js -->
            </div>
        </section>

        <!-- Formulario de Consulta por Categoría Migratoria -->
        <section class="estatus-section">
            <h2>Consulta por Estatus / Categoría Migratoria</h2>
            <form id="form-estatus">
                <div class="form-group">
                    <label for="select-categoria">Selecciona tu condición en Costa Rica:</label>
                    <select id="select-categoria" required>
                        <option value="" disabled selected>-- Selecciona una categoría --</option>
                        <option value="residencia">Residencia Permanente / Regularizado (DIMEX)</option>
                        <option value="refugiado">Refugiado Aprobado</option>
                        <option value="solicitante">Solicitante de Refugio (Documento en trámite)</option>
                        <option value="categoria_especial">Régimen Especial / Tratados (CA, Caribe, México, Sudamérica)</option>
                        <option value="internacional">Estudiante Internacional / Visa Estudiantil / Sin Regularizar</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Consultar Beneficios</button>
            </form>

            <div id="result-box" class="result-box hidden">
                <h3 id="result-title"></h3>
                <p id="result-description"></p>
                <ul id="result-list"></ul>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
